<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Vehicle Booking Tool</title>
    <style>
        /* 简单美化样式，提升体验 */
        .container {
            max-width: 800px;
            margin: 20px auto;
            padding: 20px;
            font-family: Arial, sans-serif;
        }
        .login-section, .frequency-section, .facility_select {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 4px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
        th {
            background-color: #f5f5f5;
        }
        input, select {
            padding: 6px;
            margin: 0 5px;
            width: 150px;
        }
        input[type="datetime-local"] {
            width: 180px;
        }
        input[type="date"] {
            width: 150px;
        }
        input[type="time"] {
            width: 100px;
        }
        input[type="number"] {
            width: 80px;
        }
        .time-duplicate {
            background-color: #fff3f3;
            border: 1px solid #ff9999;
        }
        .duplicate-warning {
            color: #dc3545;
            font-size: 12px;
            margin-left: 5px;
        }
        button {
            padding: 6px 12px;
            margin: 0 3px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
            color: white;
        }
        .btn-add {
            background-color: #28a745;
        }
        .btn-remove {
            background-color: #dc3545;
        }
        .btn-start {
            background-color: #007bff;
            padding: 10px 20px;
            font-size: 16px;
        }
        .btn-stop {
            background-color: #007bff;
            padding: 10px 20px;
            font-size: 16px;
        }
        .footer-bar {
            margin-top: 15px;
        }
        /* 隐藏类 */
        .hidden {
            display: none;
        }
        /* Type选择区域样式 */
        .type-select-section {
            margin-bottom: 15px;
            padding: 10px;
            border: 1px solid #eee;
            border-radius: 4px;
            background-color: #f9f9f9;
        }
        .type-label {
            margin-right: 20px;
            font-weight: normal;
        }
        .type-radio-group {
            display: inline-block;
            margin-left: 10px;
        }
        .type-radio-group label {
            margin-right: 15px;
        }
        /* 日期选择器行样式 */
        .date-selector-row {
            background-color: #f0f8ff;
            font-weight: bold;
        }
        .date-selector-row td {
            padding: 12px 8px;
        }
        .time-input {
            width: 100px;
        }
    </style>
</head>

<body>
    <div class="container">
        <h3 style="margin-top:0; margin-bottom: 20px;">Container List</h3>

        <!-- 登录信息输入框 -->
        <div class="login-section">
            <div class="login-label">
                <span>🧍‍♂️ Account :</span>
                <input type="text" id="username" placeholder="Your username" value="">
                <input type="password" id="password" placeholder="Your password" value="">
            </div>
        </div>

        <!-- 刷新频率输入框 -->
        <div class="frequency-section">
            <div class="frequency-label">
                <span>⏱️ Refresh Frequency(s) :</span>
                <input type="text" id="frequency" placeholder="e.g.: 1.5" value="">
            </div>
        </div>

        <div class="facility_select">
            <div class="facility_label">
                <span> Facility:</span>
                <input type="radio" name="facility" id="dpw" value="DP WORLD Port Botany" checked onclick="toggleTableMode()"><label>DP WORLD Port Botany</label>
                <input type="radio" name="facility" id="patrick" value="Patrick Port Botany" onclick="toggleTableMode()"><label>Patrick Port Botany</label>
            </div>
        </div>

        <!-- Patrick模式下的Type选择区域 (初始隐藏) -->
        <div id="patrick-type-section" class="type-select-section hidden">
            <span class="type-label">📦 Booking Type:</span>
            <div class="type-radio-group">
                <input type="radio" name="bookingType" id="pickup-type" value="PickUp" checked onclick="updatePatrickTableTitle()">
                <label for="pickup-type">🔵 Pick Up</label>

                <input type="radio" name="bookingType" id="dropoff-type" value="DropOff" onclick="updatePatrickTableTitle()">
                <label for="dropoff-type">🔴 Drop Off</label>
            </div>
        </div>

        <!-- 数据表格 - DP World模式 (ContainerId/Date/Type) -->
        <table id="data-table-dpw" class="dpw-table">
            <thead>
                <tr>
                    <th>ContainerId</th>
                    <th>Date & Time</th>
                    <th>Type</th>
                    <th style="width: 170px;">Action</th>
                </tr>
            </thead>
            <tbody id="table-body-dpw">
                <!-- 初始行（不可删除） -->
                <tr id="dpw-row-0">
                    <td><input type="text" placeholder="Container Id" id="dpw-id-0" class="dpw-input"></td>
                    <td><input type="datetime-local" id="dpw-datetime-0" class="dpw-input datetime-input" step="3600" onchange="enforceHourOnly(this)"></td>
                    <td>
                        <select id="dpw-select-0" class="dpw-select">
                            <option value="PickUp">Pick_Up</option>
                            <option value="DropOff">Drop_Off</option>
                        </select>
                    </td>
                    <td>
                        <button class="btn btn-add" onclick="addDpwRow()">➕ Add</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Patrick模式表格 (Date/Time/Count) 初始隐藏 -->
        <table id="data-table-patrick" class="patrick-table hidden">
            <thead id="patrick-table-header">
                <tr>
                    <th id="patrick-type-header" colspan="4">🔵 Pick Up Bookings</th>
                </tr>
                <tr>
                    <th style="width: 120px;">Date</th>
                    <th style="width: 100px;">Time</th>
                    <th style="width: 80px;">Count</th>
                    <th style="width: 170px;">Action</th>
                </tr>
            </thead>
            <tbody id="table-body-patrick">
                <!-- 日期选择行（第一行，不可删除） -->
                <tr id="patrick-date-row" class="date-selector-row">
                    <td>
                        <input type="date" id="patrick-date" class="patrick-date-input" value="2026-02-27">
                    </td>
                    <td colspan="3" style="text-align: left; color: #666;">
                        ⏰ 下方选择的时间均为左侧Date当日的时间
                    </td>
                </tr>
                <!-- 初始时段行（不可删除） -->
                <tr id="patrick-row-0">
                    <td></td> <!-- 日期单元格留空，使用第一行设置的日期 -->
                    <td><input type="time" id="patrick-time-0" class="patrick-input time-input" value="08:00" step="3600" onchange="validateTimeUnique(this)"></td>
                    <td><input type="number" placeholder="Count" id="patrick-count-0" class="patrick-input" min="1" value="1"></td>
                    <td>
                        <button class="btn btn-add" onclick="addPatrickRow()">➕ Add</button>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- 开始按钮 -->
        <div class="footer-bar">
            <button class="btn-start" onclick="startAction()">🚀 Start</button>
        </div>
    </div>

    <script>
        let dpwRowCount = 1;           // DP World表格行计数
        let patrickRowCount = 1;        // Patrick表格行计数

        // 初始化：根据默认选中的radio显示对应的表格
        document.addEventListener('DOMContentLoaded', function() {
            toggleTableMode();
            // 设置默认日期为今天
            setDefaultDate();
        });

        // 设置默认日期为今天
        function setDefaultDate() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            const defaultDate = `${year}-${month}-${day}`;

            const dateInput = document.getElementById('patrick-date');
            if (dateInput && !dateInput.value) {
                dateInput.value = defaultDate;
            }
        }

        // 强制DateTime-Local只能选择整点时间
        function enforceHourOnly(inputElement) {
            if (!inputElement.value) return;

            // 获取当前值
            let datetime = inputElement.value;

            // 检查是否有分钟部分
            if (datetime.includes(':')) {
                // 分割日期和时间
                const [datePart, timePart] = datetime.split('T');
                const [hours, minutes] = timePart.split(':');

                // 如果分钟不是00，强制设置为00
                if (minutes !== '00') {
                    // 设置为整点
                    inputElement.value = `${datePart}T${hours}:00`;
                }
            }
        }

        // 强制Time输入为整点并检查重复
        function enforceTimeHourOnly(timeInput) {
            if (!timeInput.value) return;

            const timeValue = timeInput.value;
            const [hours, minutes] = timeValue.split(':');

            // 如果分钟不是00，强制设置为整点
            if (minutes !== '00') {
                timeInput.value = `${hours}:00`;
            }

            // 检查时间是否重复
            validateTimeUnique(timeInput);
        }

        // 验证时间是否唯一
        function validateTimeUnique(changedInput) {
            // 获取所有时间输入框
            const timeInputs = document.querySelectorAll('#table-body-patrick tr:not(#patrick-date-row) input[type="time"]');
            const timeValues = new Map(); // 用于存储时间和对应的元素

            // 先收集所有时间值
            timeInputs.forEach(input => {
                const timeValue = input.value;
                if (timeValue) {
                    if (!timeValues.has(timeValue)) {
                        timeValues.set(timeValue, []);
                    }
                    timeValues.get(timeValue).push(input);
                }
            });

            // 检查重复并标记
            let hasDuplicate = false;
            timeValues.forEach((inputs, timeValue) => {
                if (inputs.length > 1) {
                    // 有重复时间
                    hasDuplicate = true;
                    inputs.forEach(input => {
                        input.classList.add('time-duplicate');
                        // 添加或更新警告信息
                        let warningSpan = input.nextElementSibling;
                        if (!warningSpan || !warningSpan.classList.contains('duplicate-warning')) {
                            warningSpan = document.createElement('span');
                            warningSpan.className = 'duplicate-warning';
                            warningSpan.innerHTML = '⚠️ 时间重复';
                            input.parentNode.insertBefore(warningSpan, input.nextSibling);
                        }
                    });
                } else {
                    // 唯一时间，移除警告样式
                    inputs.forEach(input => {
                        input.classList.remove('time-duplicate');
                        // 移除警告信息
                        const warningSpan = input.nextElementSibling;
                        if (warningSpan && warningSpan.classList.contains('duplicate-warning')) {
                            warningSpan.remove();
                        }
                    });
                }
            });

            // 禁用或启用开始按钮
            const startBtn = document.querySelector('.btn-start');
            if (startBtn) {
                if (hasDuplicate) {
                    startBtn.disabled = true;
                    startBtn.style.opacity = '0.5';
                    startBtn.title = '存在重复的时间，请修改';
                } else {
                    startBtn.disabled = false;
                    startBtn.style.opacity = '1';
                    startBtn.title = '';
                }
            }

            return !hasDuplicate;
        }

        // 获取当前选中的日期
        function getSelectedDate() {
            const dateInput = document.getElementById('patrick-date');
            return dateInput ? dateInput.value : '';
        }

        // 格式化日期为显示格式
        function formatDateForDisplay(dateString) {
            if (!dateString) return '';
            const [year, month, day] = dateString.split('-');
            return `${day}/${month}/${year}`;
        }

        // 格式化日期时间为指定格式
        function formatDateTime(datetimeString) {
            if (!datetimeString) return '';
            const date = new Date(datetimeString);
            const day = String(date.getDate()).padStart(2, '0');
            const month = String(date.getMonth() + 1).padStart(2, '0');
            const year = date.getFullYear();
            const hours = String(date.getHours()).padStart(2, '0');
            return `${day}/${month}/${year}:${hours}`;
        }

        // 更新Patrick表格标题
        function updatePatrickTableTitle() {
            const pickupRadio = document.getElementById('pickup-type');
            const headerCell = document.getElementById('patrick-type-header');

            if (pickupRadio.checked) {
                headerCell.textContent = '🔵 Pick Up Bookings';
                headerCell.style.color = '#007bff';
            } else {
                headerCell.textContent = '🔴 Drop Off Bookings';
                headerCell.style.color = '#dc3545';
            }
        }

        // 切换表格显示模式
        function toggleTableMode() {
            const dpwRadio = document.getElementById('dpw');
            const dpwTable = document.getElementById('data-table-dpw');
            const patrickTable = document.getElementById('data-table-patrick');
            const patrickTypeSection = document.getElementById('patrick-type-section');

            if (dpwRadio.checked) {
                // 显示DP World表格，隐藏Patrick相关元素
                dpwTable.classList.remove('hidden');
                patrickTable.classList.add('hidden');
                patrickTypeSection.classList.add('hidden');
            } else {
                // 隐藏DP World表格，显示Patrick相关元素
                dpwTable.classList.add('hidden');
                patrickTable.classList.remove('hidden');
                patrickTypeSection.classList.remove('hidden');
                // 进入Patrick模式时验证时间唯一性
                setTimeout(() => validateTimeUnique(), 100);
            }
        }

        // 添加DP World新行
        function addDpwRow() {
            const tbody = document.getElementById('table-body-dpw');
            const rowId = `dpw-row-${dpwRowCount}`;
            const idId = `dpw-id-${dpwRowCount}`;
            const datetimeId = `dpw-datetime-${dpwRowCount}`;
            const selectId = `dpw-select-${dpwRowCount}`;

            // 创建新行
            const newRow = document.createElement('tr');
            newRow.id = rowId;

            // 1. ContainerId列
            const td1 = document.createElement('td');
            const input1 = document.createElement('input');
            input1.type = 'text';
            input1.placeholder = 'Container Id';
            input1.id = idId;
            input1.className = 'dpw-input';
            td1.appendChild(input1);

            // 2. DateTime列
            const td2 = document.createElement('td');
            const input2 = document.createElement('input');
            input2.type = 'datetime-local';
            input2.id = datetimeId;
            input2.className = 'dpw-input datetime-input';
            input2.step = '3600';
            input2.onchange = function() { enforceHourOnly(this); };
            // 设置默认时间
            const now = new Date();
            now.setHours(now.getHours() + 1, 0, 0, 0);
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const hours = String(now.getHours()).padStart(2, '0');
            input2.value = `${year}-${month}-${day}T${hours}:00`;
            td2.appendChild(input2);

            // 3. Type列
            const td3 = document.createElement('td');
            const select3 = document.createElement('select');
            select3.id = selectId;
            select3.className = 'dpw-select';
            const optionPU = document.createElement('option');
            optionPU.value = 'PickUp';
            optionPU.text = 'Pick_Up';
            const optionDF = document.createElement('option');
            optionDF.value = 'DropOff';
            optionDF.text = 'Drop_Off';
            select3.appendChild(optionPU);
            select3.appendChild(optionDF);
            td3.appendChild(select3);

            // 4. 操作列
            const td4 = document.createElement('td');
            const addBtn = document.createElement('button');
            addBtn.className = 'btn btn-add';
            addBtn.innerHTML = '➕ Add';
            addBtn.onclick = addDpwRow;

            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn btn-remove';
            removeBtn.innerHTML = '✖ Delete';
            removeBtn.onclick = function() {
                const currentRow = this.closest('tr');
                if (currentRow && currentRow.id !== 'dpw-row-0') {  // 第一行不可删除
                    tbody.removeChild(currentRow);
                } else {
                    alert('第一行不能删除');
                }
            };

            td4.appendChild(addBtn);
            td4.appendChild(removeBtn);

            newRow.appendChild(td1);
            newRow.appendChild(td2);
            newRow.appendChild(td3);
            newRow.appendChild(td4);
            tbody.appendChild(newRow);

            dpwRowCount++;
        }

        // 添加Patrick新行（时段行）
        function addPatrickRow() {
            const tbody = document.getElementById('table-body-patrick');
            const rowId = `patrick-row-${patrickRowCount}`;
            const timeId = `patrick-time-${patrickRowCount}`;
            const countId = `patrick-count-${patrickRowCount}`;

            const newRow = document.createElement('tr');
            newRow.id = rowId;

            // 日期单元格（留空，使用第一行设置的日期）
            const td0 = document.createElement('td');
            td0.textContent = '';
            newRow.appendChild(td0);

            // Time列 - 已添加整点限制
            const td1 = document.createElement('td');
            const input1 = document.createElement('input');
            input1.type = 'time';
            input1.id = timeId;
            input1.className = 'patrick-input time-input';
            input1.step = '3600';  // 只允许整点（3600秒 = 1小时）
            input1.onchange = function() { enforceTimeHourOnly(this); };

            // 找到一个可用的默认时间（不重复的整点）
            const usedTimes = getUsedTimes();
            let defaultHour = 9; // 从09:00开始
            while (usedTimes.has(`${String(defaultHour).padStart(2, '0')}:00`)) {
                defaultHour++;
                if (defaultHour > 23) defaultHour = 0;
            }
            input1.value = `${String(defaultHour).padStart(2, '0')}:00`;
            td1.appendChild(input1);

            // Count列
            const td2 = document.createElement('td');
            const input2 = document.createElement('input');
            input2.type = 'number';
            input2.placeholder = 'Count';
            input2.id = countId;
            input2.className = 'patrick-input';
            input2.min = '1';
            input2.value = '1';
            td2.appendChild(input2);

            // 操作列
            const td3 = document.createElement('td');
            const addBtn = document.createElement('button');
            addBtn.className = 'btn btn-add';
            addBtn.innerHTML = '➕ Add';
            addBtn.onclick = addPatrickRow;

            const removeBtn = document.createElement('button');
            removeBtn.className = 'btn btn-remove';
            removeBtn.innerHTML = '✖ Delete';
            removeBtn.onclick = function() {
                const currentRow = this.closest('tr');
                if (currentRow && currentRow.id !== 'patrick-row-0') {
                    tbody.removeChild(currentRow);
                    // 删除后重新验证时间唯一性
                    validateTimeUnique();
                } else {
                    alert('第一行不能删除');
                }
            };

            td3.appendChild(addBtn);
            td3.appendChild(removeBtn);

            newRow.appendChild(td1);
            newRow.appendChild(td2);
            newRow.appendChild(td3);
            tbody.appendChild(newRow);

            patrickRowCount++;

            // 添加后验证时间唯一性
            validateTimeUnique(input1);
        }

        // 获取所有已使用的时间
        function getUsedTimes() {
            const timeInputs = document.querySelectorAll('#table-body-patrick tr:not(#patrick-date-row) input[type="time"]');
            const usedTimes = new Set();
            timeInputs.forEach(input => {
                if (input.value) {
                    usedTimes.add(input.value);
                }
            });
            return usedTimes;
        }

        // 开始提交数据
        async function startAction() {
            // 1. 获取登录信息
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            // 2. 验证登录信息
            if (!username || !password) {
                alert('❌ 请填写完整的账号和密码！');
                return;
            }

            // 3. 处理刷新频率
            const frequencyInput = document.getElementById('frequency').value.trim();
            let frequency = 1;
            if (frequencyInput) {
                frequency = parseFloat(frequencyInput);
                if (isNaN(frequency) || frequency <= 0) {
                    alert('❌ 刷新频率必须是大于0的数字（如1.5）！');
                    return;
                }
            }

            // 4. 获取选中的facility
            const facility = document.querySelector('input[name="facility"]:checked');
            if (!facility) {
                alert('请选择Facility类型');
                return;
            }

            const facility_id = facility.id;
            console.log('选中的ID:', facility_id);

            // 5. 根据选中的facility准备请求数据
            let requestData = {};

            if (facility_id === 'dpw') {
                // DP World模式：保持原有格式
                const rows = document.querySelectorAll('#table-body-dpw tr');
                const bookings = [];
                let hasValidData = false;

                rows.forEach(row => {
                    const idInput = row.querySelector('td:first-child input');
                    const datetimeInput = row.querySelector('td:nth-child(2) input[type="datetime-local"]');
                    const selectElement = row.querySelector('select');

                    const containerId = idInput ? idInput.value.trim() : '';
                    let datetime = datetimeInput ? datetimeInput.value : '';

                    if (datetime && datetime.includes(':')) {
                        const [datePart, timePart] = datetime.split('T');
                        const [hours] = timePart.split(':');
                        datetime = `${datePart}T${hours}:00`;
                    }

                    const typeValue = selectElement ? (selectElement.value === 'PickUp' ? 0 : 1) : 0;

                    if (containerId && datetime) {
                        const formattedDate = formatDateTime(datetime);
                        bookings.push({ containerId, date: formattedDate, type: typeValue });
                        hasValidData = true;
                    }
                });

                if (!hasValidData) {
                    alert('❌ 请至少填写一行有效的ContainerId和Date！');
                    return;
                }

                requestData = {
                    username: username,
                    password: password,
                    frequency: frequency,
                    facility: facility_id,
                    bookings: bookings
                };

            } else {
                // Patrick模式：检查时间是否重复
                const isTimeValid = validateTimeUnique();
                if (!isTimeValid) {
                    alert('❌ 存在重复的时间段，请修改后再提交！');
                    return;
                }

                const bookingType = document.querySelector('input[name="bookingType"]:checked');
                if (!bookingType) {
                    alert('请选择预订类型 (Pick Up 或 Drop Off)');
                    return;
                }

                const typeValue = bookingType.value === 'PickUp' ? 0 : 1;

                // 获取选中的日期
                const selectedDate = document.getElementById('patrick-date').value;
                if (!selectedDate) {
                    alert('请选择日期');
                    return;
                }

                // 格式化日期为 DD/MM/YYYY
                const [year, month, day] = selectedDate.split('-');
                const formattedDate = `${day}/${month}/${year}`;

                // 收集所有时段数据
                const rows = document.querySelectorAll('#table-body-patrick tr:not(#patrick-date-row)');
                const timeSlots = [];
                let hasValidData = false;

                rows.forEach(row => {
                    const timeInput = row.querySelector('td:nth-child(2) input[type="time"]');
                    const countInput = row.querySelector('td:nth-child(3) input[type="number"]');

                    let timeValue = timeInput ? timeInput.value : '';

                    // 确保时间是整点格式
                    if (timeValue && timeValue.includes(':')) {
                        const [hours] = timeValue.split(':');
                        // 去掉前导0，将"08"转换为"8"
                        timeValue = parseInt(hours, 10).toString();
                    }

                    const count = countInput ? parseInt(countInput.value) || 1 : 1;

                    if (timeValue && count > 0) {
                        timeSlots.push({
                            time: timeValue.split(':')[0], // 只存储小时数字
                            count: count
                        });
                        hasValidData = true;
                    }
                });

                if (!hasValidData) {
                    alert('❌ 请至少填写一行有效的Time和Count！');
                    return;
                }

                // Patrick模式的新数据结构
                requestData = {
                    username: username,
                    password: password,
                    frequency: frequency,
                    facility: facility_id,
                    bookings: {
                        date: formattedDate,
                        type: typeValue,
                        slots: timeSlots  // [{time: "08", count: 2}, {time: "09", count: 3}, ...]
                    }
                };
            }

            console.log('请求数据:', JSON.stringify(requestData, null, 2));

            // 6. 发送AJAX请求
            try {
                const xhr = new XMLHttpRequest();
                xhr.open('POST', 'http://127.0.0.1:5000/book', true);
                xhr.setRequestHeader('Content-Type', 'application/json');
                xhr.setRequestHeader('Accept', 'application/json');

                xhr.onload = function() {
                    if (xhr.status >= 200 && xhr.status < 300) {
                        try {
                            const result = JSON.parse(xhr.responseText);
                            alert(`✅ ${result.message || '任务已成功启动'}`);
                            console.log('预订成功:', result);
                        } catch (e) {
                            alert('✅ 任务已成功启动（响应格式非JSON）');
                        }
                    } else {
                        alert(`❌ 请求失败: ${xhr.status} - ${xhr.statusText}`);
                    }
                };

                xhr.onerror = function() {
                    alert('❌ 连接失败！请确认：\n1. Flask服务是否运行在 http://127.0.0.1:5000 \n2. 无跨域限制');
                };

                xhr.send(JSON.stringify(requestData));
            } catch (error) {
                alert(`❌ 发送请求时出错：${error.message}`);
                console.error('请求错误:', error);
            }
        }
    </script>
</body>
</html>
